<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="utf-8">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Swiper & Pretendard CDN -->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="/aistory/css/swiper-bundle.min.css">

  <link rel="stylesheet" href="/aistory/css/mrblue_reset.css">

  

  <style>

    :root {

      --cv-bg: #111317;

      --cv-toolbar-bg: rgba(22, 26, 34, 0.96);

      --cv-toolbar-line: rgba(255, 255, 255, 0.12);

      --cv-accent: #8b5cf6;

      --cv-accent-glow: rgba(139, 92, 246, 0.35);

      --cv-ink: #f1f5f9;

      --cv-muted: #94a3b8;

    }

    * { box-sizing: border-box; }

    html, body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background-color: var(--cv-bg);

      font-family: 'Pretendard', sans-serif;

      color: var(--cv-ink);

      user-select: none;

      -webkit-user-select: none;

    }

    

    /* 최상단 툴바 */

    .cv-top-bar {

      position: fixed;

      top: 0;

      left: 0;

      right: 0;

      height: 52px;

      background: var(--cv-toolbar-bg);

      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--cv-toolbar-line);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 16px;

      z-index: 1000;

      transition: transform 0.25s ease;

    }

    .cv-top-bar.is-hidden { transform: translateY(-100%); }

    

    .cv-top-left {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }

    .cv-back-btn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 36px;

      height: 36px;

      border-radius: 8px;

      color: var(--cv-ink);

      text-decoration: none;

      background: rgba(255, 255, 255, 0.06);

      transition: background 0.15s;

    }

    .cv-back-btn:hover { background: rgba(255, 255, 255, 0.15); }

    

    .cv-work-title-group {

      display: flex;

      flex-direction: column;

      min-width: 0;

    }

    .cv-work-title {

      font-size: 13.5px;

      font-weight: 700;

      color: var(--cv-ink);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      margin: 0;

    }

    .cv-ep-select {

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid var(--cv-toolbar-line);

      color: var(--cv-ink);

      font-size: 12px;

      font-weight: 600;

      border-radius: 6px;

      padding: 2px 8px;

      cursor: pointer;

      outline: none;

    }

    .cv-ep-select option {

      background: #1e293b;

      color: #ffffff;

    }

    

    .cv-top-right {

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .cv-tool-btn {

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid var(--cv-toolbar-line);

      color: var(--cv-ink);

      padding: 6px 12px;

      border-radius: 8px;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      transition: all 0.15s;

    }

    .cv-tool-btn:hover {

      background: rgba(255, 255, 255, 0.18);

    }

    .cv-tool-btn.active {

      background: var(--cv-accent);

      border-color: var(--cv-accent);

      color: #ffffff;

    }

    

    /* 메인 뷰어 캔버스 */

    .cv-main-stage {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      padding-top: 52px;

      padding-bottom: 56px;

    }

    

    /* Swiper 레이아웃 */

    .swiper {

      width: 100%;

      height: 100%;

    }

        .swiper-slide {

      display: flex;

      align-items: center;

      justify-content: center;

      background: transparent;

      height: 100%;

      width: 100%;

      overflow: hidden !important;

      position: relative;

    }

    

    /* 비활성 슬라이드는 완전 비표시 및 클릭 차단 -> 확대/팬/전환 시 인접 슬라이드 겹침 원천 방지 */

    .swiper-slide {

      pointer-events: none !important;

      opacity: 0 !important;

      visibility: hidden !important;

    }

    .swiper-slide.swiper-slide-active {

      pointer-events: auto !important;

      opacity: 1 !important;

      visibility: visible !important;

    }

    #comicSwiper {

      --cv-zoom: 1;

      --cv-pan-x: 0px;

      --cv-pan-y: 0px;

    }

    .cv-spread-wrapper {

      display: flex;

      align-items: center;

      justify-content: center;

      height: 100%;

      max-height: 100%;

      max-width: 100%;

      gap: 0;

      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.85);

      background: #000000;

      transform: translate(var(--cv-pan-x, 0px), var(--cv-pan-y, 0px)) scale(var(--cv-zoom, 1));

      transform-origin: center center;

      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);

      will-change: transform;

    }

    .is-panning .cv-spread-wrapper {

      transition: none !important;

    }

    .cv-click-overlay.is-zoomed {

      cursor: grab !important;

    }

    .cv-click-overlay.is-zoomed.is-panning {

      cursor: grabbing !important;

    }

    .cv-page-frame {

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #000000;

    }

    .cv-page-frame img {

      max-height: 100%;

      max-width: 100%;

      height: auto;

      width: auto;

      object-fit: contain;

      display: block;

      pointer-events: none;

    }

    

    /* 단면일 때의 페이지 프레임 */

    .cv-single-mode .cv-spread-wrapper {

      max-width: min(100vw, 900px);

    }

    

    /* 오디션 전용 서브바 영역 확보 */

    body.has-sub-bar .cv-main-stage {

      padding-top: 92px;

    }

    body.has-sub-bar .cv-click-overlay {

      top: 92px;

    }

    /* 오디션 전용 캐릭터 보이스 퀵 플레이어 바 & 자막 */

    .cv-audition-bar {

      display: flex;

      align-items: center;

      gap: 6px;

      padding: 6px 14px;

      background: rgba(15, 23, 42, 0.92);

      border-bottom: 1px solid rgba(139, 92, 246, 0.25);

      position: absolute;

      top: 52px;

      left: 0;

      right: 0;

      z-index: 110;

      backdrop-filter: blur(8px);

      overflow-x: auto;

    }

    .audition-bar-title {

      font-size: 11.5px;

      font-weight: 800;

      color: #a78bfa;

      white-space: nowrap;

      margin-right: 4px;

    }

    .audition-char-btn {

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.15);

      color: #e2e8f0;

      padding: 4px 10px;

      border-radius: 9999px;

      font-size: 11px;

      font-weight: 700;

      cursor: pointer;

      white-space: nowrap;

      transition: all 0.15s;

    }

    .audition-char-btn:hover {

      background: rgba(139, 92, 246, 0.3);

      border-color: #8b5cf6;

      color: #ffffff;

    }

    .audition-char-btn.active {

      background: #8b5cf6;

      border-color: #8b5cf6;

      color: #ffffff;

      box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);

    }

    .cv-voice-subtitle {

      position: absolute;

      bottom: 72px;

      left: 50%;

      transform: translateX(-50%);

      background: rgba(15, 23, 42, 0.95);

      color: #f8fafc;

      border: 1px solid rgba(139, 92, 246, 0.4);

      padding: 10px 20px;

      border-radius: 12px;

      font-size: 13.5px;

      font-weight: 600;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);

      z-index: 200;

      max-width: 90vw;

      text-align: center;

      animation: subFadeIn 0.25s ease-out;

      pointer-events: none;

    }

    .cv-voice-subtitle strong {

      color: #c084fc;

      margin-right: 6px;

    }

    @keyframes subFadeIn {

      from { opacity: 0; transform: translate(-50%, 10px); }

      to { opacity: 1; transform: translate(-50%, 0); }

    }

    /* 클릭 넘김 오버레이 (좌우 분할 터치 영역) */

    .cv-click-overlay {

      position: absolute;

      top: 52px;

      bottom: 56px;

      left: 0;

      right: 0;

      display: flex;

      z-index: 100;

      pointer-events: auto;

    }

    .cv-click-left, .cv-click-center, .cv-click-right {

      height: 100%;

      user-select: none;

      -webkit-user-select: none;

    }

    .cv-click-left {

      width: 30%;

      cursor: pointer;

    }

    .cv-click-center {

      width: 40%;

      cursor: pointer;

    }

    .cv-click-right {

      width: 30%;

      cursor: pointer;

    }

    

    /* 최하단 내비게이션 바 */

    .cv-bottom-bar {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 56px;

      background: var(--cv-toolbar-bg);

      backdrop-filter: blur(12px);

      border-top: 1px solid var(--cv-toolbar-line);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 18px;

      z-index: 1000;

      transition: transform 0.25s ease;

    }

    .cv-bottom-bar.is-hidden { transform: translateY(100%); }

    

    .cv-page-indicator {

      font-size: 13px;

      font-weight: 700;

      color: var(--cv-ink);

      min-width: 70px;

      text-align: center;

      font-variant-numeric: tabular-nums;

    }

    

    .cv-slider-track {

      flex: 1;

      max-width: 600px;

      margin: 0 20px;

      display: flex;

      align-items: center;

      gap: 12px;

    }

    .cv-range-slider {

      width: 100%;

      height: 5px;

      -webkit-appearance: none;

      background: rgba(255, 255, 255, 0.2);

      border-radius: 4px;

      outline: none;

      cursor: pointer;

    }

    .cv-range-slider::-webkit-slider-thumb {

      -webkit-appearance: none;

      width: 16px;

      height: 16px;

      border-radius: 50%;

      background: var(--cv-accent);

      box-shadow: 0 0 10px var(--cv-accent-glow);

      cursor: pointer;

    }

    .cv-range-slider::-moz-range-thumb {

      width: 16px;

      height: 16px;

      border-radius: 50%;

      background: var(--cv-accent);

      box-shadow: 0 0 10px var(--cv-accent-glow);

      cursor: pointer;

      border: none;

    }

    

    .cv-nav-btn {

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid var(--cv-toolbar-line);

      color: var(--cv-ink);

      padding: 6px 14px;

      border-radius: 8px;

      font-size: 12px;

      font-weight: 600;

      text-decoration: none;

      display: inline-flex;

      align-items: center;

      gap: 4px;

      transition: all 0.15s;

    }

    .cv-nav-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .cv-nav-btn.disabled {

      opacity: 0.35;

      pointer-events: none;

    }

    

    /* 모바일 대응 */

    @media (max-width: 768px) {

      .cv-top-bar { height: 48px; padding: 0 10px; }

      .cv-bottom-bar { height: 50px; padding: 0 10px; }

      .cv-main-stage { padding-top: 48px; padding-bottom: 50px; }

      .cv-click-overlay { top: 48px; bottom: 50px; }

      .cv-work-title { max-width: 140px; font-size: 12px; }

      .cv-slider-track { margin: 0 8px; }

      .cv-tool-btn span.lbl { display: none; }

    }

    /* --- Interactive Voice Comic Audio Layer & Hotspots --- */

    .cv-canvas-wrap {

      position: relative;

      aspect-ratio: auto;

      max-height: 100%;

      max-width: 100%;

      width: auto;

      height: auto;

      display: flex;

      align-items: center;

      justify-content: center;

      line-height: 0;

    }

    .cv-canvas-wrap img {

      width: auto;

      height: auto;

      max-width: 100%;

      max-height: calc(100vh - 120px);

      object-fit: contain;

      display: block;

      pointer-events: none;

    }

    .cv-balloon-svg {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      pointer-events: none;

      z-index: 15;

    }

    .cv-balloon-path {

      fill: transparent;

      stroke: transparent;

      stroke-width: 3.5px;

      stroke-linejoin: round;

      stroke-linecap: round;

      transition: stroke 0.2s ease, filter 0.2s ease;

      pointer-events: none;

    }

    .cv-balloon-path.hovered {

      stroke: rgba(88, 166, 255, 0.75);

      filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.7));

    }

    .cv-balloon-path.playing {

      stroke: #58a6ff !important;

      stroke-width: 3.5px !important;

      filter: drop-shadow(0 0 9px rgba(88, 166, 255, 0.95)) drop-shadow(0 0 2px rgba(255, 255, 255, 0.85)) !important;

      animation: cv-blue-pulse 1.3s infinite ease-in-out;

    }

    @keyframes cv-blue-pulse {

      0% { stroke: #58a6ff; filter: drop-shadow(0 0 5px rgba(88, 166, 255, 0.7)) drop-shadow(0 0 1px rgba(255, 255, 255, 0.5)); }

      50% { stroke: #79c0ff; filter: drop-shadow(0 0 11px rgba(121, 192, 255, 1)) drop-shadow(0 0 3px rgba(255, 255, 255, 0.95)); }

      100% { stroke: #58a6ff; filter: drop-shadow(0 0 5px rgba(88, 166, 255, 0.7)) drop-shadow(0 0 1px rgba(255, 255, 255, 0.5)); }

    }

    .cv-hotspot-layer {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      pointer-events: none;

      z-index: 150;

    }

    .cv-hotspot {

      position: absolute;

      border-radius: 50%;

      cursor: pointer;

      pointer-events: auto;

      z-index: 160;

      background: transparent !important;

      border: none !important;

      outline: none !important;

      box-shadow: none !important;

    }

    .cv-hotspot.cloud-shape {

      border-radius: 40% 40% 45% 45% / 50% 50% 45% 45%;

    }

    .cv-hotspot.rect-shape {

      border-radius: 6px;

    }

    .cv-hotspot .cv-tooltip {

      position: absolute;

      top: -38px;

      left: 50%;

      transform: translateX(-50%);

      background: #0f172a;

      color: #f1f5f9;

      font-size: 0.75rem;

      font-weight: 600;

      padding: 5px 12px;

      border-radius: 6px;

      border: 1px solid #38bdf8;

      white-space: nowrap;

      pointer-events: none;

      opacity: 0;

      transition: opacity 0.2s ease, transform 0.2s ease;

      box-shadow: 0 4px 14px rgba(0,0,0,0.6);

      z-index: 30;

      line-height: 1.35;

    }

    .cv-hotspot:hover .cv-tooltip {

      opacity: 1;

      transform: translateX(-50%) translateY(-4px);

    }

    /* Audio Top Toolbar Buttons */

    .cv-tool-btn.cv-audio-btn.active {

      background: rgba(56, 189, 248, 0.2);

      border-color: #38bdf8;

      color: #38bdf8;

    }

    .cv-tool-btn.cv-autoplay-btn.active {

      background: linear-gradient(135deg, #f59e0b, #d97706);

      border-color: #fbbf24;

      color: #ffffff;

      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);

    }

  </style>

  <style>
    .cv-public-note{position:fixed;left:50%;top:58px;z-index:120;transform:translateX(-50%);padding:7px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(15,23,42,.86);color:#e2e8f0;font-size:12px;font-weight:700;pointer-events:none;backdrop-filter:blur(8px)}
    @media(max-width:720px){.cv-public-note{top:108px;font-size:10px;max-width:80vw;text-align:center}}
  </style>
</head>

<body>
  <div class="cv-public-note">인트로 말풍선을 누르면 연결된 음성이 재생됩니다.</div>

  <!-- 1. 최상단 툴바 -->

  <header class="cv-top-bar" id="topBar">

    <div class="cv-top-left">

      <a class="cv-back-btn" href="../" title="작품 홈으로 돌아가기">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>

      </a>

      <div class="cv-work-title-group">

        <h1 class="cv-work-title">&#47924;&#54889;&#44592;&#54801;&#51204; [&#44060;&#51221;&#54032;]</h1>

        <select class="cv-ep-select" id="epSelect" disabled aria-label="공개 특별관 1권">
  <option value="73" selected>1권 · 매탄옹: 겨울길과 서시 · 112쪽 음성 뷰어</option>
</select>

      </div>

    </div>

    <div class="cv-top-right">

      <!-- 오디오 앰비언트 버튼 -->

      

      <!-- 오디오 앰비언트 버튼 -->

      <button type="button" class="cv-tool-btn cv-audio-btn" id="btnAmbient" onclick="toggleAmbient()" title="설원바람 앰비언트 BGM 토글">

        <span id="ambientIcon">❄️</span>

        <span class="lbl" id="ambientLbl">설원바람: OFF</span>

      </button>

      

      <!-- 보이스 오토 플레이 버튼 -->

      <button type="button" class="cv-tool-btn cv-autoplay-btn" id="btnAutoPlay" onclick="toggleAutoPlay()" title="현재 화면 대사 및 내레이션 자동 연속 재생">

        <span id="autoplayIcon">▶</span>

        <span class="lbl" id="autoplayLbl">보이스 오토</span>

      </button>

      <!-- 배율 확대/축소 (100% / 125% / 150% / 200%) -->

      <button type="button" class="cv-tool-btn" id="btnZoom" onclick="toggleZoom()" title="배율 확대/축소 (100% → 125% → 150% → 200% / 단축키 +, -, 0)">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>

        <span class="lbl" id="zoomLbl">100%</span>

      </button>

      <!-- 2면 / 1면 전환 버튼 -->

      <button type="button" class="cv-tool-btn" id="btnSpreadMode" onclick="toggleSpreadMode()">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="18" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/></svg>

        <span class="lbl" id="spreadModeLbl">2면 펼침</span>

      </button>

      <!-- 넘김 방향 버튼 (좌우 / 우좌) -->

      <button type="button" class="cv-tool-btn" id="btnDirection" onclick="toggleDirection()" title="페이지 넘김 방향 변경">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 11-4-4-4 4M17 18H7"/></svg>

        <span class="lbl" id="directionLbl">좌→우</span>

      </button>

      

      <!-- 전체화면 토글 -->

      <button type="button" class="cv-tool-btn" onclick="toggleFullScreen()" title="전체화면">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>

      </button>

    </div>

  </header>

  

  <!-- 2. 메인 뷰어 캔버스 (Swiper) -->

  <main class="cv-main-stage" id="mainStage">

    <div class="swiper" id="comicSwiper">

      <div class="swiper-wrapper" id="swiperWrapper">

        <!-- JS로 스프레드 슬라이드 동적 렌더링 -->

      </div>

    </div>

  </main>

  <!-- 3. 터치 및 클릭 넘김 분할 오버레이 -->

  <div class="cv-click-overlay">

    <div class="cv-click-left" id="clickPrev" title="이전 페이지"></div>

    <div class="cv-click-center" id="clickToggleUi" title="메뉴 토글"></div>

    <div class="cv-click-right" id="clickNext" title="다음 페이지"></div>

  </div>

  <!-- 4. 하단 네비게이션 툴바 -->

  <footer class="cv-bottom-bar" id="bottomBar">

    <div>

      

      <span class="cv-nav-btn disabled">◀ 이전 권</span>

            console.error('Audio playback error:', err);

            if (hotspotEl) hotspotEl.classList.remove('playing');

            if (pathEl) pathEl.classList.remove('playing');

            applyDucking(false);

            currentSpeechSource = null;

          }

          resolve();

        }

      });

    }

    async function runAutoPlay() {

      if (isAutoPlaying) return;

      isAutoPlaying = true;

      const btn = document.getElementById('btnAutoPlay');

      const lbl = document.getElementById('autoplayLbl');

      if (btn) btn.classList.add('active');

      if (lbl) lbl.textContent = '오토 정지';

      if (!isAmbientPlaying) toggleAmbient();

      // Sequential playback across spreads

      while (isAutoPlaying) {

        const curIdx = swiper ? swiper.activeIndex : 0;

        const currentPages = spreadList[curIdx] || [0];

        const activeSlide = (swiper && swiper.slides) ? swiper.slides[curIdx] : document;

        for (const pIdx of currentPages) {

          if (!isAutoPlaying) break;

          const pageNo = pIdx + 1;

          const targets = COMIC_AUDIO_TARGETS[pageNo] || [];

          for (const t of targets) {

            if (!isAutoPlaying) break;

            const hs = activeSlide ? activeSlide.querySelector(`.cv-hotspot[data-target-id="${t.id}"]`) : null;

            const pathEl = activeSlide ? activeSlide.querySelector(`.cv-balloon-path[data-target-id="${t.id}"]`) : null;

            await playAudioClip(t.audio, hs, pathEl, t.label);

            if (!isAutoPlaying) break;

            await new Promise(r => setTimeout(r, 600)); // 0.6s breath between dialogue

          }

        }

        if (!isAutoPlaying) break;

        // Advance to next spread if available

        if (swiper && swiper.activeIndex < spreadList.length - 1) {

          await new Promise(r => setTimeout(r, 700));

          if (!isAutoPlaying) break;

          swiper.slideNext();

          await new Promise(r => setTimeout(r, 800)); // wait for slide transition

        } else {

          // Reached end of comic

          break;

        }

      }

      isAutoPlaying = false;

      if (btn) btn.classList.remove('active');

      if (lbl) lbl.textContent = '보이스 오토';

    }

    function toggleAutoPlay() {

      if (!isAutoPlaying) {

        runAutoPlay();

      } else {

        isAutoPlaying = false;

        if (currentSpeechSource) {

          try { currentSpeechSource.stop(); } catch(e){}

          currentSpeechSource = null;

        }

        document.querySelectorAll('.cv-hotspot').forEach(h => h.classList.remove('playing'));

        document.querySelectorAll('.cv-balloon-path').forEach(p => p.classList.remove('playing'));

        applyDucking(false);

        const btn = document.getElementById('btnAutoPlay');

        const lbl = document.getElementById('autoplayLbl');

        if (btn) btn.classList.remove('active');

        if (lbl) lbl.textContent = '보이스 오토';

      }

    }

    // --- End of Audio Engine ---

    // 스프레드 인덱스 계산기

    function calculateSpreads() {
      spreadList = [];
      if (rawPages.length === 0) return;
      
      if (isSpreadScan) {
        // [스마트 2면 펼침 모드 (양면 스캔본)]
        // 각 이미지가 이미 2페이지 펼침이므로, 1장씩 와이드로 중앙 배치
        // (표지가 단면인 경우 [0]은 단독 표지, [1]부터는 2면 펼침)
        for (let i = 0; i < rawPages.length; i++) {
          spreadList.push([i]);
        }
      } else {
        // [단면 스캔본 (1장에 1페이지씩)]
        if (!isSpreadMode) {
          // 1면 단면 모드
          for (let i = 0; i < rawPages.length; i++) {
            spreadList.push([i]);
          }
        } else {
          // 2면 펼침 모드: 2장씩 묶어 1화면에 양면 펼침
          for (let i = 0; i < rawPages.length; i += 2) {
            if (i + 1 < rawPages.length) {
              spreadList.push([i, i + 1]);
            } else {
              spreadList.push([i]);
            }
          }
        }
      }
    }



    // 슬라이드 HTML 렌더링

    function renderSlides() {

      const wrapper = document.getElementById('swiperWrapper');

      wrapper.innerHTML = '';

      if (!rawPages || rawPages.length === 0) {

        wrapper.innerHTML = `

          <div class="swiper-slide" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#94a3b8; text-align:center; padding:20px;">

            <div style="font-size:48px;">📖</div>

            <h2 style="font-size:20px; font-weight:700; color:#f1f5f9; margin:0;">다음 권 준비 중입니다</h2>

            <p style="font-size:14px; max-width:400px; margin:0; line-height:1.6;">현재 작업 중인 권차입니다. 원작 대본에 맞춘 컷 생성 후 순차적으로 공개됩니다.</p>

            <div style="margin-top:12px; display:flex; gap:10px;">

              <a href="/aistory/muhwang-special.html?id=73" class="cv-nav-btn" style="background:#8b5cf6; color:#ffffff; padding:10px 20px; font-size:13px; font-weight:700;">◀ 1권으로 돌아가기</a>

              <a href="../" class="cv-nav-btn" style="padding:10px 20px; font-size:13px;">작품 홈으로</a>

            </div>

          </div>

        `;

        document.getElementById('pageIndicator').innerText = '- / -';

        document.getElementById('pageRange').max = 0;

        document.getElementById('pageRange').value = 0;

        return;

      }

      calculateSpreads();

      spreadList.forEach((pages, sIdx) => {

        const slide = document.createElement('div');

        slide.className = 'swiper-slide';

        const spreadBox = document.createElement('div');

        spreadBox.className = 'cv-spread-wrapper' + (!isSpreadMode ? ' cv-single-mode' : '');

        pages.forEach((pIdx) => {

          const frame = document.createElement('div');

          frame.className = 'cv-page-frame';

          const canvasWrap = document.createElement('div');

          canvasWrap.className = 'cv-canvas-wrap';

          const img = document.createElement('img');

          const episode73Page = (73 === 73);

          img.alt = `Page ${pIdx + 1}`;

          img.loading = (sIdx <= 2) ? 'eager' : 'lazy';

          img.decoding = 'async';

          if (sIdx <= 1) img.fetchPriority = 'high';

          if (episode73Page) { img.width = 1080; img.height = 1560; }

          img.src = rawPages[pIdx];

          const uniformMaster20 = episode73Page;

          if (uniformMaster20) {

            canvasWrap.style.width = 'min(100%, calc((100vh - 120px) * 0.6923076923))';

            canvasWrap.style.height = 'auto';

            canvasWrap.style.maxHeight = 'none';

            canvasWrap.style.aspectRatio = '1080 / 1560';

            img.style.width = '100%';

            img.style.height = 'auto';

            img.style.objectFit = 'contain';

          }

          canvasWrap.appendChild(img);

          const pageNo = pIdx + 1;

          const targets = (typeof COMIC_AUDIO_TARGETS !== 'undefined') ? (COMIC_AUDIO_TARGETS[pageNo] || []) : [];

          if (targets.length > 0) {

            const svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

            svgLayer.setAttribute('class', 'cv-balloon-svg');

            const vbW = episode73Page ? 1080 : (img.naturalWidth || 720);

            const vbH = episode73Page ? 1560 : (img.naturalHeight || 1100);

            svgLayer.setAttribute('viewBox', `0 0 ${vbW} ${vbH}`);

            svgLayer.setAttribute('preserveAspectRatio', uniformMaster20 ? 'xMidYMid meet' : 'none');

            const hotspotLayer = document.createElement('div');

            hotspotLayer.className = 'cv-hotspot-layer';

            targets.forEach(t => {

              const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');

              pathEl.setAttribute('d', t.svg);

              pathEl.setAttribute('id', `path-${t.id}`);

              pathEl.setAttribute('class', 'cv-balloon-path');

              pathEl.setAttribute('data-target-id', t.id);

              svgLayer.appendChild(pathEl);

              const hs = document.createElement('div');

              hs.className = `cv-hotspot ${t.type === 'cloud' ? 'cloud-shape' : (t.type === 'rect' ? 'rect-shape' : '')}`;

              hs.style.left = t.left;

              hs.style.top = t.top;

              hs.style.width = t.width;

              hs.style.height = t.height;

              hs.setAttribute('data-target-id', t.id);

              const tooltip = document.createElement('div');

              tooltip.className = 'cv-tooltip';

              tooltip.innerHTML = `<strong>${t.speaker}</strong><br><small>${t.label}</small>`;

              hs.appendChild(tooltip);

              hs.addEventListener('mouseenter', () => pathEl.classList.add('hovered'));

              hs.addEventListener('mouseleave', () => pathEl.classList.remove('hovered'));

              hs.addEventListener('click', (e) => {

                e.stopPropagation();

                playAudioClip(t.audio, hs, pathEl, t.label);

              });

              hotspotLayer.appendChild(hs);

            });

            canvasWrap.appendChild(svgLayer);

            canvasWrap.appendChild(hotspotLayer);

          }

          frame.appendChild(canvasWrap);

          spreadBox.appendChild(frame);

        });

        slide.appendChild(spreadBox);

        wrapper.appendChild(slide);

      });

      // 슬라이더 max값 갱신

      const range = document.getElementById('pageRange');

      range.max = Math.max(0, spreadList.length - 1);

    }

    // 현재·인접 스프레드만 우선 로드·디코딩한다. fade로 112장을 겹치지 않는다.

    function primeSpread(index) {

      const slides = document.querySelectorAll('#swiperWrapper > .swiper-slide');

      for (let i = Math.max(0, index - 2); i <= Math.min(slides.length - 1, index + 2); i++) {

        slides[i].querySelectorAll('img').forEach((img) => {

          img.loading = 'eager';

          img.fetchPriority = (i === index) ? 'high' : 'auto';

          if (img.complete && img.naturalWidth > 0 && typeof img.decode === 'function') {

            img.decode().catch(() => {});

          }

        });

      }

    }

    function navigateBy(delta) {

      if (!swiper || swiper.animating) return false;

      const target = Math.max(0, Math.min(spreadList.length - 1, swiper.activeIndex + delta));

      if (target === swiper.activeIndex) return false;

      panX = 0;

      panY = 0;

      const swiperEl = document.getElementById("comicSwiper");

      if (swiperEl) {

        swiperEl.style.setProperty("--cv-pan-x", "0px");

        swiperEl.style.setProperty("--cv-pan-y", "0px");

      }

      primeSpread(target);

      swiper.slideTo(target);

      return true;

    }

    // Swiper 초기화 및 갱신

    function initSwiper(initialIndex = 0) {

      if (swiper) {

        swiper.destroy(true, true);

      }

      renderSlides();

      primeSpread(initialIndex);

      swiper = new Swiper('#comicSwiper', {

        initialSlide: initialIndex,

        speed: 0,

        spaceBetween: 0,

        effect: 'slide',

        allowTouchMove: false,

        simulateTouch: false,

        watchSlidesProgress: true,

        lazyPreloadPrevNext: 2,

        preventInteractionOnTransition: true,

        on: {

          slideChange: function () {

            primeSpread(this.activeIndex);

            updatePageIndicator();

            panX = 0;

            panY = 0;

            const swiperEl = document.getElementById('comicSwiper');

            if (swiperEl) {

              swiperEl.style.setProperty('--cv-pan-x', '0px');

              swiperEl.style.setProperty('--cv-pan-y', '0px');

            }

          }

        }

      });

      updatePageIndicator();

    }

    // 페이지 인디케이터 및 슬라이더 갱신

    function updatePageIndicator() {

      if (!swiper || spreadList.length === 0) return;

      const idx = swiper.activeIndex;

      const currentPages = spreadList[idx] || [0];

      document.querySelectorAll('#swiperWrapper > .swiper-slide').forEach((slide, i) => {

        slide.setAttribute('aria-hidden', i === idx ? 'false' : 'true');

      });

      

      let pageText = '';

      if (currentPages.length === 1) {

        pageText = `${currentPages[0] + 1} / ${rawPages.length}`;

      } else {

        pageText = `${currentPages[0] + 1}-${currentPages[1] + 1} / ${rawPages.length}`;

      }

      document.getElementById('pageIndicator').innerText = pageText;

      document.getElementById('pageRange').value = idx;

    }

    // Episode 73 live-book index bridge: navigation only, never changes book data.

    window.mwjGoBookPage = function(pageNo) {

      const target = Number(pageNo) - 1;

      if (!swiper || !Number.isInteger(target)) return false;

      const idx = spreadList.findIndex(pages => pages.includes(target));

      if (idx < 0) return false;

      primeSpread(idx);

      swiper.slideTo(idx); return true;

    };

    // 2면 / 1면 토글

    // --- 배율 확대/축소 및 자유 팬(Pan) 내비게이션 엔진 ---

    const ZOOM_LEVELS = [1.0, 1.25, 1.5, 2.0];

    let currentZoomIndex = 0;

    let currentZoom = 1.0;

    let panX = 0;

    let panY = 0;

    let isPanning = false;

    let hasDragged = false;

    let startX = 0, startY = 0;

    let initialPanX = 0, initialPanY = 0;

    function applyZoom(newZoom, resetPan = true) {

      currentZoom = newZoom;

      currentZoomIndex = ZOOM_LEVELS.indexOf(newZoom);

      if (currentZoomIndex === -1) currentZoomIndex = 0;

      if (resetPan) {

        panX = 0;

        panY = 0;

      }

      const swiperEl = document.getElementById('comicSwiper');

      const overlayEl = document.getElementById('clickOverlay');

      const btnZoom = document.getElementById('btnZoom');

      const zoomLbl = document.getElementById('zoomLbl');

      if (swiperEl) {

        swiperEl.style.setProperty('--cv-zoom', currentZoom);

        swiperEl.style.setProperty('--cv-pan-x', panX + 'px');

        swiperEl.style.setProperty('--cv-pan-y', panY + 'px');

      }

      if (btnZoom && zoomLbl) {

        zoomLbl.innerText = Math.round(currentZoom * 100) + '%';

        if (currentZoom > 1.0) {

          btnZoom.classList.add('active');

          if (overlayEl) overlayEl.classList.add('is-zoomed');

        } else {

          btnZoom.classList.remove('active');

          if (overlayEl) overlayEl.classList.remove('is-zoomed');

        }

      }

    }

    function toggleZoom() {

      currentZoomIndex = (currentZoomIndex + 1) % ZOOM_LEVELS.length;

      applyZoom(ZOOM_LEVELS[currentZoomIndex], true);

    }

    function zoomIn() {

      if (currentZoomIndex < ZOOM_LEVELS.length - 1) {

        currentZoomIndex++;

        applyZoom(ZOOM_LEVELS[currentZoomIndex], false);

      }

    }

    function zoomOut() {

      if (currentZoomIndex > 0) {

        currentZoomIndex--;

        applyZoom(ZOOM_LEVELS[currentZoomIndex], false);

      }

    }

    function resetZoom() {

      applyZoom(1.0, true);

    }

    function toggleSpreadMode() {
      isSpreadMode = !isSpreadMode;
      const btn = document.getElementById('btnSpreadMode');
      const lbl = document.getElementById('spreadModeLbl');
      
      if (isSpreadScan) {
        if (isSpreadMode) {
          if (btn) btn.classList.add('active');
          if (lbl) lbl.innerText = '스마트 2면';
        } else {
          if (btn) btn.classList.remove('active');
          if (lbl) lbl.innerText = '1장 보기';
        }
      } else {
        if (isSpreadMode) {
          if (btn) btn.classList.add('active');
          if (lbl) lbl.innerText = '2면 펼침';
        } else {
          if (btn) btn.classList.remove('active');
          if (lbl) lbl.innerText = '1면 단면';
        }
      }

      // 현재 보고 있던 원본 페이지 번호 유지
      const curSpread = spreadList[swiper ? swiper.activeIndex : 0] || [0];
      const targetPage = curSpread[0];
      calculateSpreads();

      // 새 스프레드에서 targetPage가 속한 슬라이드 인덱스 탐색
      let newIdx = 0;
      spreadList.forEach((pages, idx) => {
        if (pages.includes(targetPage)) newIdx = idx;
      });
      initSwiper(newIdx);
    }

    // 넘김 방향 토글

    function toggleDirection() {

      isRTL = !isRTL;

      const lbl = document.getElementById('directionLbl');

      lbl.innerText = isRTL ? '우→좌' : '좌→우';

    }

    // 툴바 숨김/표시 토글

    function toggleUi() {

      isUiVisible = !isUiVisible;

      const top = document.getElementById('topBar');

      const bottom = document.getElementById('bottomBar');

      if (isUiVisible) {

        top.classList.remove('is-hidden');

        bottom.classList.remove('is-hidden');

      } else {

        top.classList.add('is-hidden');

        bottom.classList.add('is-hidden');

      }

    }

    // 전체화면 토글

    function toggleFullScreen() {

      if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen().catch(err => {});

      } else {

        if (document.exitFullscreen) document.exitFullscreen();

      }

    }

    // 초기 실행

    document.addEventListener('DOMContentLoaded', () => {

      const btn = document.getElementById('btnSpreadMode');

      if (isSpreadScan) {
        if (btn) btn.classList.add('active');
        const lbl = document.getElementById('spreadModeLbl');
        if (lbl) lbl.innerText = '스마트 2면';
      } else {
        if (isSpreadMode && btn) btn.classList.add('active');
        const lbl = document.getElementById('spreadModeLbl');
        if (lbl) lbl.innerText = isSpreadMode ? '2면 펼침' : '1면 단면';
      }

      initSwiper(0);

      // 터치/클릭 오버레이 이벤트 바인딩 & 말풍선 핫스팟 투과 연동

      const elPrev = document.getElementById('clickPrev');

      const elNext = document.getElementById('clickNext');

      const elCenter = document.getElementById('clickCenter') || document.getElementById('clickToggleUi');

      const clickOverlay = document.querySelector('.cv-click-overlay');

      function forwardToHotspot(e) {

        if (!clickOverlay) return false;

        clickOverlay.style.pointerEvents = 'none';

        const under = document.elementFromPoint(e.clientX, e.clientY);

        clickOverlay.style.pointerEvents = 'auto';

        if (!under) return false;

        let hs = under.closest('.cv-hotspot');
        if (!hs && under.closest('.poem-reading-hit')) {
          hs = document.querySelector('.swiper-slide-active .cv-hotspot[data-target-id="POEM_CN"]');
        }

        if (hs) {

          // Strictly ensure hotspot belongs to current active slide!

          const slide = hs.closest('.swiper-slide');

          if (slide && !slide.classList.contains('swiper-slide-active')) {

            return false;

          }

          hs.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));

          return true;

        }

        return false;

      }

      if (clickOverlay) {

        let lastHoveredHs = null;

        clickOverlay.addEventListener('mousemove', (e) => {

          clickOverlay.style.pointerEvents = 'none';

          const under = document.elementFromPoint(e.clientX, e.clientY);

          clickOverlay.style.pointerEvents = 'auto';

          let hs = under ? under.closest('.cv-hotspot') : null;

          if (hs) {

            const slide = hs.closest('.swiper-slide');

            if (slide && !slide.classList.contains('swiper-slide-active')) {

              hs = null;

            }

          }

          if (hs !== lastHoveredHs) {

            if (lastHoveredHs) lastHoveredHs.dispatchEvent(new MouseEvent('mouseleave'));

            if (hs) hs.dispatchEvent(new MouseEvent('mouseenter'));

            lastHoveredHs = hs;

          }

        });

        clickOverlay.addEventListener('mouseleave', () => {

          if (lastHoveredHs) {

            lastHoveredHs.dispatchEvent(new MouseEvent('mouseleave'));

            lastHoveredHs = null;

          }

        });

      }

      // --- 확대 시 마우스 드래그 & 터치 패닝(Pan) 이벤트 ---

      const swiperStage = document.getElementById('comicSwiper');

      if (clickOverlay && swiperStage) {

        clickOverlay.addEventListener('dblclick', (e) => {

          e.preventDefault();

          if (currentZoom > 1.0) {

            resetZoom();

          } else {

            applyZoom(1.5, true);

          }

        });

        const startPan = (clientX, clientY) => {

          if (currentZoom <= 1.0) return;

          isPanning = true;

          hasDragged = false;

          startX = clientX;

          startY = clientY;

          initialPanX = panX;

          initialPanY = panY;

          swiperStage.classList.add('is-panning');

          clickOverlay.classList.add('is-panning');

        };

        const movePan = (clientX, clientY) => {

          if (!isPanning || currentZoom <= 1.0) return;

          const dx = clientX - startX;

          const dy = clientY - startY;

          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {

            hasDragged = true;

          }

          if (!hasDragged) return; // 5px 미만 클릭 지터 시에는 pan 좌표 변경 차단

          const maxPanX = window.innerWidth * (currentZoom - 1) * 0.65;

          const maxPanY = window.innerHeight * (currentZoom - 1) * 0.65;

          panX = Math.max(-maxPanX, Math.min(maxPanX, initialPanX + dx));

          panY = Math.max(-maxPanY, Math.min(maxPanY, initialPanY + dy));

          swiperStage.style.setProperty('--cv-pan-x', panX + 'px');

          swiperStage.style.setProperty('--cv-pan-y', panY + 'px');

        };

        const endPan = () => {

          if (isPanning) {

            isPanning = false;

            swiperStage.classList.remove('is-panning');

            clickOverlay.classList.remove('is-panning');

          }

        };

        clickOverlay.addEventListener('mousedown', (e) => startPan(e.clientX, e.clientY));

        window.addEventListener('mousemove', (e) => movePan(e.clientX, e.clientY));

        window.addEventListener('mouseup', endPan);

        clickOverlay.addEventListener('touchstart', (e) => {

          if (e.touches.length === 1) startPan(e.touches[0].clientX, e.touches[0].clientY);

        }, { passive: true });

        window.addEventListener('touchmove', (e) => {

          if (e.touches.length === 1) movePan(e.touches[0].clientX, e.touches[0].clientY);

        }, { passive: true });

        window.addEventListener('touchend', endPan);

      }

      if (elPrev) {

        elPrev.addEventListener('click', (e) => {

          e.preventDefault();

          e.stopPropagation();

          if (hasDragged) { hasDragged = false; return; }

          if (forwardToHotspot(e)) return;

          navigateBy(isRTL ? 1 : -1);

        });

      }

      if (elNext) {

        elNext.addEventListener('click', (e) => {

          e.preventDefault();

          e.stopPropagation();

          if (hasDragged) { hasDragged = false; return; }

          if (forwardToHotspot(e)) return;

          navigateBy(isRTL ? -1 : 1);

        });

      }

      if (elCenter) {

        elCenter.addEventListener('click', (e) => {

          e.preventDefault();

          e.stopPropagation();

          if (hasDragged) { hasDragged = false; return; }

          if (forwardToHotspot(e)) return;

          toggleUi();

        });

      }

      // 하단 슬라이더 바 조작 시 해당 페이지 즉시 이동 연동

      const pageRange = document.getElementById('pageRange');

      if (pageRange) {

        pageRange.addEventListener('input', (e) => {

          const targetIdx = parseInt(e.target.value, 10);

          if (isNaN(targetIdx) || !swiper || !spreadList[targetIdx]) return;

          // 드래그 중 인디케이터 실시간 갱신

          const currentPages = spreadList[targetIdx] || [0];

          let pageText = '';

          if (currentPages.length === 1) {

            pageText = `${currentPages[0] + 1} / ${rawPages.length}`;

          } else {

            pageText = `${currentPages[0] + 1}-${currentPages[1] + 1} / ${rawPages.length}`;

          }

          document.getElementById('pageIndicator').innerText = pageText;

          // 해당 슬라이드를 먼저 준비하고 즉시 점프한다.

          primeSpread(targetIdx);

          swiper.slideTo(targetIdx, 0);

        });

        pageRange.addEventListener('change', (e) => {

          const targetIdx = parseInt(e.target.value, 10);

          if (isNaN(targetIdx) || !swiper || !spreadList[targetIdx]) return;

          primeSpread(targetIdx);

          swiper.slideTo(targetIdx, 0);

          updatePageIndicator();

        });

      }

      // 키보드 방향키는 이 핸들러 하나만 사용한다. 중복 Swiper keyboard 처리를 금지한다.

      window.addEventListener('keydown', (e) => {

        if (e.key === 'ArrowLeft') {

          if (!swiper) return;

          e.preventDefault();

          navigateBy(isRTL ? 1 : -1);

        } else if (e.key === 'ArrowRight') {

          if (!swiper) return;

          e.preventDefault();

          navigateBy(isRTL ? -1 : 1);

        } else if (e.key === ' ' || e.key === 'Spacebar') {

          toggleUi();

        } else if (e.key === '+' || e.key === '=') {

          e.preventDefault();

          zoomIn();

        } else if (e.key === '-' || e.key === '_') {

          e.preventDefault();

          zoomOut();

        } else if (e.key === '0') {

          e.preventDefault();

          resetZoom();

        }

      });

      // 윈도우 리사이즈 시 가로/세로 자동 반응형 감지

      let resizeTimer = null;

      window.addEventListener('resize', () => {

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {

          const autoSpread = (window.innerWidth >= 900);

          if (autoSpread !== isSpreadMode) {

            isSpreadMode = autoSpread;

            const btn = document.getElementById('btnSpreadMode');

            const lbl = document.getElementById('spreadModeLbl');

            if (isSpreadMode) {

              if (btn) btn.classList.add('active');

              if (lbl) lbl.innerText = '2면 펼침';

            } else {

              if (btn) btn.classList.remove('active');

              if (lbl) lbl.innerText = '1면 단면';

            }

            const curSpread = spreadList[swiper ? swiper.activeIndex : 0] || [0];

            const targetPage = curSpread[0];

            calculateSpreads();

            let newIdx = 0;

            spreadList.forEach((pages, i) => {

              if (pages.includes(targetPage)) newIdx = i;

            });

            initSwiper(newIdx);

          }

        }, 250);

      });

    });

  </script>
