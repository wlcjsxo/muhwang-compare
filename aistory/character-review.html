<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사마달 캐릭터 시트 · Horizon</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/aistory/css/character-review.css?v=samadal-public-20261028">
  <style>
    .fleet-nav{grid-template-columns:minmax(0,1fr)!important}.toolbar{grid-template-columns:minmax(260px,1fr) minmax(180px,260px)!important}.public-detail{display:grid;gap:14px}.public-detail header{display:grid;gap:7px}.public-detail blockquote{margin:0;padding:14px 16px;border-left:3px solid #38bdf8;background:rgba(15,23,42,.5);line-height:1.7}.public-detail dl{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin:0}.public-detail dt{color:#94a3b8}.public-detail dd{margin:0;color:#e2e8f0}.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}@media(max-width:820px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr!important}.public-detail dl{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <span class="eyebrow">Horizon · Sama Dal Character Archive</span>
        <h1>사마달 563 캐릭터 시트</h1>
        <p class="sub">사마달 무협 캐릭터 563인의 컬러·먹선 시트와 공개 캐릭터 정보를 열람합니다.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="db-indicator" id="archive-status">공개 열람 모드</span>
      </div>
    </header>

    <nav class="fleet-nav" aria-label="사마달 캐릭터 시트">
      <button type="button" class="fleet-tab active">
        <span class="tab-badge">Sama Dal Archive</span>
        <span class="tab-title">사마달 (Sama Dal)</span>
        <span class="tab-sub">컬러·먹선 563 캐릭터 공개 열람본</span>
      </button>
    </nav>

    <section class="metrics" aria-label="공개 캐릭터 현황">
      <div class="metric"><span>전체 캐릭터</span><strong id="total-count">0</strong></div>
      <div class="metric"><span>현재 표시</span><strong id="visible-count">0</strong></div>
      <div class="metric pass"><span>컬러 이미지</span><strong id="color-count">0</strong></div>
      <div class="metric"><span>먹선 이미지</span><strong id="ink-count">0</strong></div>
      <div class="metric archetype"><span>캐릭터 원형</span><strong id="archetype-count">0</strong></div>
    </section>

    <section class="toolbar" aria-label="공개 캐릭터 검색">
      <input id="search" type="search" placeholder="ID·이름·배역 검색">
      <select id="archetype-filter" aria-label="캐릭터 원형 필터">
        <option value="">캐릭터 원형 전체</option>
      </select>
    </section>

    <p class="notice">캐릭터 이름, 배역, 공개 설명, 컬러·먹선 이미지만 표시합니다.</p>
    <p class="notice" id="archive-message" role="status" aria-live="polite">공개 캐릭터 자료를 불러오는 중입니다.</p>

    <section id="grid" class="grid" aria-label="사마달 캐릭터 카드">
      <p class="empty">공개 캐릭터 자료를 불러오는 중입니다.</p>
    </section>

    <nav class="pager" aria-label="캐릭터 페이지">
      <button id="prev-page" class="pager-move" type="button">‹ 이전</button>
      <div id="page-buttons" class="page-buttons" aria-label="페이지 바로가기"></div>
      <button id="next-page" class="pager-move" type="button">다음 ›</button>
      <strong id="page-info">1 / 1</strong>
    </nav>
  </main>

  <dialog id="viewer">
    <div class="modal-head">
      <strong id="modal-title">캐릭터 상세</strong>
      <button id="close-modal" type="button">닫기</button>
    </div>
    <div class="modal-grid">
      <img id="modal-color" alt="캐릭터 컬러 시트">
      <img id="modal-ink" alt="캐릭터 먹선 시트">
    </div>
    <section id="modal-public" class="dna-detail public-detail" aria-label="캐릭터 공개 정보"></section>
  </dialog>

  <script src="/aistory/js/character-review.js?v=samadal-public-sanitized-20261028"></script>
</body>
</html>
